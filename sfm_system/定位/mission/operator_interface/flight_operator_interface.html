<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SfM Flight Operator</title>
  <style>
    :root {
      --bg: #111316;
      --panel: #1a1d21;
      --panel-2: #22262b;
      --line: #363c44;
      --text: #f0f3f5;
      --muted: #a7b0b8;
      --ok: #3fbf7f;
      --warn: #e6b94f;
      --danger: #ef6b5f;
      --blue: #5aa7e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr) 132px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #171a1e;
    }
    .brand { font-weight: 650; }
    .status-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      display: inline-block;
    }
    .dot.ok { background: var(--ok); }
    .dot.danger { background: var(--danger); }
    .main {
      display: grid;
      grid-template-columns: minmax(360px, 1.05fr) minmax(360px, 0.95fr);
      min-height: 0;
    }
    .pane {
      min-width: 0;
      min-height: 0;
      position: relative;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: hidden;
    }
    .pane:last-child { border-right: 0; }
    .pane-title {
      position: absolute;
      z-index: 2;
      top: 10px;
      left: 10px;
      padding: 5px 8px;
      background: rgba(17, 19, 22, 0.76);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: var(--text);
    }
    canvas, .video {
      width: 100%;
      height: 100%;
      display: block;
    }
    .video {
      object-fit: contain;
      background: #08090b;
    }
    .hud {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 220px;
      padding: 8px;
      background: rgba(17, 19, 22, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
    }
    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 2px 0;
      color: var(--muted);
    }
    .metric strong { color: var(--text); font-weight: 600; }
    .controls {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(340px, 1.2fr) minmax(280px, 0.9fr);
      gap: 10px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: #171a1e;
    }
    .group {
      min-width: 0;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }
    .group h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 650;
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      height: 34px;
      min-width: 72px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
    }
    .btn:hover { border-color: #59616b; }
    .btn.primary { border-color: #2d6e9f; background: #1f4d70; }
    .btn.warn { border-color: #8f6b16; background: #513f14; }
    .btn.danger { border-color: #8d2e28; background: #58231f; }
    .btn.active { outline: 2px solid var(--blue); outline-offset: 1px; }
    label {
      display: grid;
      gap: 4px;
      min-width: 120px;
      color: var(--muted);
    }
    input[type="range"] { width: 150px; }
    .log {
      height: 52px;
      overflow: auto;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 6px;
    }
    @media (max-width: 860px) {
      .shell { grid-template-rows: 44px minmax(0, 1fr) auto; }
      .main { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; }
      .controls { grid-template-columns: 1fr; }
      .hud { width: 190px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">SfM Flight Operator</div>
      <div class="status-strip">
        <span><span id="connDot" class="dot"></span> <span id="connText">backend offline</span></span>
        <span>mode <strong id="modeText">MANUAL</strong></span>
        <span>localization <strong id="locText">WAIT</strong></span>
      </div>
    </header>

    <main class="main">
      <section class="pane" aria-label="Map point cloud">
        <div class="pane-title">地圖點雲 / 路徑 / 定位</div>
        <canvas id="mapCanvas"></canvas>
        <div class="hud" aria-live="polite">
          <div class="metric"><span>x</span><strong id="xVal">0.00</strong></div>
          <div class="metric"><span>y</span><strong id="yVal">0.00</strong></div>
          <div class="metric"><span>z</span><strong id="zVal">0.00</strong></div>
          <div class="metric"><span>inliers</span><strong id="inlierVal">0</strong></div>
          <div class="metric"><span>reproj</span><strong id="reprojVal">-</strong></div>
          <div class="metric"><span>state</span><strong id="stateVal">BOOT</strong></div>
        </div>
      </section>

      <section class="pane" aria-label="Drone video stream">
        <div class="pane-title">串流影像</div>
        <img id="videoFeed" class="video" alt="drone stream" src="">
      </section>
    </main>

    <footer class="controls">
      <section class="group">
        <h2>飛行模式</h2>
        <div class="row">
          <button class="btn active" id="manualBtn" data-command="manual">手動</button>
          <button class="btn" id="autoBtn" data-command="auto">自動</button>
          <button class="btn warn" data-command="hover">懸停</button>
          <button class="btn danger" data-command="land">原地降落</button>
        </div>
        <div class="log" id="eventLog">ready</div>
      </section>

      <section class="group">
        <h2>任務控制</h2>
        <div class="row">
          <button class="btn primary" data-command="takeoff">起飛</button>
          <button class="btn primary" data-command="boot_lock">定位鎖定</button>
          <button class="btn primary" data-command="start_auto">開始巡檢</button>
          <button class="btn" data-command="pause">暫停路徑</button>
          <button class="btn" data-command="resume">繼續路徑</button>
        </div>
      </section>

      <section class="group">
        <h2>鏡頭</h2>
        <div class="row">
          <label>俯仰
            <input id="gimbalPitch" type="range" min="-90" max="20" value="-20">
          </label>
          <label>縮放
            <input id="zoom" type="range" min="1" max="6" step="0.1" value="1">
          </label>
          <button class="btn" data-command="snapshot">截圖</button>
        </div>
      </section>
    </footer>
  </div>

  <script>
    const state = {
      connected: false,
      mode: "MANUAL",
      loc: "WAIT",
      pose: { x: 0, y: 0, z: 0, yaw: 0 },
      inliers: 0,
      reproj: null,
      trackerState: "BOOT",
      points: [],
      path: [[-3, -1], [-1, 0.6], [1.2, 0.2], [2.5, 1.4]],
      history: []
    };

    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d");
    const log = document.getElementById("eventLog");
    const video = document.getElementById("videoFeed");

    function appendLog(message) {
      const t = new Date().toLocaleTimeString();
      log.textContent = `${t} ${message}\n` + log.textContent;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawMap();
    }

    function mapToScreen(x, z) {
      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(rect.width, rect.height) / 7.2;
      return [rect.width / 2 + x * scale, rect.height / 2 - z * scale];
    }

    function drawMap() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#15181c";
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.strokeStyle = "#2b3138";
      ctx.lineWidth = 1;
      for (let i = -5; i <= 5; i++) {
        const [x0, y0] = mapToScreen(i, -5);
        const [x1, y1] = mapToScreen(i, 5);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        const [a0, b0] = mapToScreen(-5, i);
        const [a1, b1] = mapToScreen(5, i);
        ctx.beginPath(); ctx.moveTo(a0, b0); ctx.lineTo(a1, b1); ctx.stroke();
      }
      ctx.fillStyle = "rgba(150,170,185,.65)";
      for (const p of state.points) {
        const [sx, sy] = mapToScreen(p[0], p[2]);
        ctx.fillRect(sx, sy, 1.4, 1.4);
      }
      ctx.strokeStyle = "#e6b94f";
      ctx.lineWidth = 3;
      ctx.beginPath();
      state.path.forEach((p, i) => {
        const [sx, sy] = mapToScreen(p[0], p[1]);
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      });
      ctx.stroke();
      ctx.strokeStyle = "#5aa7e8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      state.history.forEach((p, i) => {
        const [sx, sy] = mapToScreen(p.x, p.z);
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      });
      ctx.stroke();
      const [dx, dy] = mapToScreen(state.pose.x, state.pose.z);
      ctx.fillStyle = "#3fbf7f";
      ctx.beginPath(); ctx.arc(dx, dy, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#3fbf7f";
      ctx.beginPath();
      ctx.moveTo(dx, dy);
      ctx.lineTo(dx + Math.cos(state.pose.yaw) * 22, dy - Math.sin(state.pose.yaw) * 22);
      ctx.stroke();
    }

    function updateText() {
      document.getElementById("modeText").textContent = state.mode;
      document.getElementById("locText").textContent = state.loc;
      document.getElementById("stateVal").textContent = state.trackerState;
      document.getElementById("xVal").textContent = state.pose.x.toFixed(2);
      document.getElementById("yVal").textContent = state.pose.y.toFixed(2);
      document.getElementById("zVal").textContent = state.pose.z.toFixed(2);
      document.getElementById("inlierVal").textContent = String(state.inliers);
      document.getElementById("reprojVal").textContent = state.reproj == null ? "-" : state.reproj.toFixed(2);
      document.getElementById("connText").textContent = state.connected ? "backend connected" : "backend offline";
      document.getElementById("connDot").className = `dot ${state.connected ? "ok" : ""}`;
      document.getElementById("manualBtn").classList.toggle("active", state.mode === "MANUAL");
      document.getElementById("autoBtn").classList.toggle("active", state.mode === "AUTO");
    }

    async function sendCommand(command, payload = {}) {
      appendLog(command);
      if (command === "manual") state.mode = "MANUAL";
      if (command === "auto" || command === "start_auto") state.mode = "AUTO";
      if (command === "hover") state.trackerState = "HOVER";
      if (command === "land") state.trackerState = "LAND";
      updateText();
      try {
        const res = await fetch("/api/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command, payload })
        });
        state.connected = res.ok;
      } catch (_err) {
        state.connected = false;
      }
      updateText();
    }

    async function pollState() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) throw new Error("state unavailable");
        const data = await res.json();
        Object.assign(state, data);
        state.connected = true;
      } catch (_err) {
        state.connected = false;
        const t = Date.now() / 1000;
        state.pose = { x: Math.sin(t * 0.12) * 1.6, y: -1.2, z: Math.cos(t * 0.12) * 1.1, yaw: t * 0.12 };
        state.loc = "SIM";
        state.trackerState = state.mode === "AUTO" ? "TRACK" : "HOVER";
        state.inliers = 180 + Math.round(Math.sin(t) * 35);
        state.reproj = 2.6;
      }
      state.history.push({ ...state.pose });
      if (state.history.length > 240) state.history.shift();
      updateText();
      drawMap();
    }

    async function loadMapPoints() {
      try {
        const res = await fetch("/api/map_points", { cache: "no-store" });
        if (!res.ok) throw new Error("map unavailable");
        const data = await res.json();
        state.points = data.points || [];
      } catch (_err) {
        state.points = Array.from({ length: 2600 }, () => [
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 5
        ]);
      }
      drawMap();
    }

    for (const button of document.querySelectorAll("[data-command]")) {
      button.addEventListener("click", () => sendCommand(button.dataset.command));
    }
    document.getElementById("gimbalPitch").addEventListener("input", (e) => {
      sendCommand("gimbal_pitch", { pitch: Number(e.target.value) });
    });
    document.getElementById("zoom").addEventListener("input", (e) => {
      sendCommand("zoom", { zoom: Number(e.target.value) });
    });

    video.onerror = () => { video.removeAttribute("src"); };
    video.src = "/api/video.jpg?stream=1";
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    loadMapPoints();
    pollState();
    setInterval(pollState, 500);
  </script>
</body>
</html>
