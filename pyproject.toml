reason = "The official PyTorch cu128 extra index (https://download.pytorch.org/whl/cu128) provides this CUDA wheel. The runtime and test locks pin its exact version and hashes, installation is offline after seeding the approved artifact bundle, and the gate records this skipped component in the CycloneDX SBOM. Revisit before expiry."
