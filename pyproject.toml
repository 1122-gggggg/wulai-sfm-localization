[[tool.security_dependency_gate.exceptions]]
package = "setuptools"
advisory_id = "PYSEC-2026-3447"
reason = "torch==2.11.0+cu128 pins setuptools<82. This advisory is limited to macOS sdist Unicode MANIFEST exclusion behavior; this Linux runtime does not build or publish sdists. Revisit when the pinned torch/runtime contract changes."
expires = "2027-02-09"

[[tool.security_dependency_gate.skip_exceptions]]
package = "torch"
version = "2.11.0+cu128"
skip_reason = "Dependency not found on PyPI and could not be audited: torch (2.11.0+cu128)"
reason = "The official PyTorch cu128 extra index (https://download.pytorch.org/whl/cu128) provides this CUDA wheel. The runtime and test locks pin its exact version and hashes, installation is offline after seeding the approved artifact bundle, and the gate records this skipped component in the CycloneDX SBOM. Revisit before expiry."
expires = "2027-02-09"

