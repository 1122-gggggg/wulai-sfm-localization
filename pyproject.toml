[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".venv",
  ".codegraph",
  ".pytest_cache",
  ".ruff_cache",
  "outputs",
  "地圖檔",
  "執行環境/package_git",
  # Imported upstream source. It is pinned and smoke-tested, but not restyled.
  "定位演算法/deploy_code/runtime",
  "定位演算法/EDM工具包",
]

[tool.ruff.lint]
# Full Pyflakes catches dead imports, name shadowing, undefined names, and other
# correctness issues in first-party code. Syntax errors remain an explicit gate.
select = ["E9", "F"]

[tool.coverage.run]
branch = true
source = [
  "tools",
  "控制介面程式",
  "定位演算法/validation",
  "定位演算法/flight_control",
  "定位演算法/deploy_code/sfm_glomap_deploy",
]
omit = [
  "*/tests/*",
  "*/test_*.py",
]

[tool.coverage.report]
# Removing committed runtime mirrors made the first-party measurement meaningful:
# the 2026-08-08 suite covers 53.55%. Keep 50% as a regression floor while
# high-risk modules receive focused tests.
fail_under = 50
precision = 2
show_missing = true
