[pytest]
# 擴圖版（定位演算法/deploy_code_expand）專用設定。
# 擴圖版與原版同名模組（direct_localizer_adapter、two_rate_tracker…）不能在同一個
# pytest 程序共存，所以另跑：.venv/bin/python -m pytest -c pytest-expand.ini
# 收集範圍：
#   1. tests/localization/deploy/ 中與擴圖版共用、內容不依賴版本的測試（逐檔列出）；
#      pythonpath 讓擴圖版模組遮蔽原版，同一份測試檔直接跑在擴圖版模組上。
#   2. tests/localization/deploy_expand/ 內擴圖版專屬（或斷言不同）的測試。
# 新增共用測試時須同步列入下方清單。
# vendor（river_map_quality / sfm_diagnosis）只有 deploy_code 一份，擴圖版共用。
# deploy_expand 必須排在最前：共用的 pose 實驗測試會在收集時把 定位演算法/validation 插入 sys.path，改變後續測試匯入的模組。
testpaths =
    tests/localization/deploy_expand
    tests/localization/deploy/test_dead_reckon_yaw_guard.py
    tests/localization/deploy/test_direct_edm_cache.py
    tests/localization/deploy/test_direct_geometry.py
    tests/localization/deploy/test_direct_lift_cache.py
    tests/localization/deploy/test_direct_motion_timing.py
    tests/localization/deploy/test_direct_point_quality.py
    tests/localization/deploy/test_direct_pose_continuity.py
    tests/localization/deploy/test_direct_retrieval_policy.py
    tests/localization/deploy/test_imu_bridge.py
    tests/localization/deploy/test_lift_reference_matches.py
    tests/localization/deploy/test_localizer_registry.py
    tests/localization/deploy/test_pose_estimation_experiment.py
    tests/localization/deploy/test_pose_experiment_report.py
    tests/localization/deploy/test_pose_filter_experiment.py
    tests/localization/deploy/test_pose_window_experiment.py
    tests/localization/deploy/test_surface_depth.py
    tests/localization/deploy/test_telemetry_pose_experiment.py
pythonpath =
    .
    執行環境
    tools
    控制介面程式
    控制介面程式/operator_interface
    控制介面程式/影片模擬串流
    定位演算法/flight_control
    定位演算法/deploy_code_expand/sfm_glomap_deploy
    定位演算法/deploy_code_expand/sfm_direct_deploy
    定位演算法/deploy_code/sfm_direct_deploy/vendor
addopts =
    --strict-config
    --strict-markers
    --timeout=60
timeout = 60
norecursedirs =
    .git
    .venv
    .codegraph
    outputs
    地圖檔
    torch_hub_cache
markers =
    smoke: quick smoke tests for critical path verification
    slow: tests that take significant time to execute
    hardware: tests requiring physical drone hardware or specific GPU resources
