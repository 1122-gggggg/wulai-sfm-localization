[pytest]
# 擴圖版（定位演算法/deploy_code_expand）專用設定。
# 擴圖版與原版同名模組（direct_localizer_adapter、two_rate_tracker…）不能在同一個
# pytest 程序共存，所以另跑：.venv/bin/python -m pytest -c pytest-expand.ini
testpaths =
    tests/localization/deploy_expand
pythonpath =
    .
    執行環境
    tools
    控制介面程式
    控制介面程式/operator_interface
    控制介面程式/影片模擬串流
    定位演算法/flight_control
    定位演算法/deploy_code_expand/sfm_glomap_deploy
    定位演算法/deploy_code_expand/sfm_direct_deploy
    定位演算法/deploy_code_expand/sfm_direct_deploy/vendor
addopts =
    --strict-config
    --strict-markers
    --timeout=60
timeout = 60
norecursedirs =
    .git
    .venv
    .codegraph
    outputs
    地圖檔
    torch_hub_cache
markers =
    smoke: quick smoke tests for critical path verification
    slow: tests that take significant time to execute
    hardware: tests requiring physical drone hardware or specific GPU resources
