[pytest]
testpaths =
    定位演算法
    控制介面程式
    模擬器
    執行環境/tools
    tools
pythonpath =
    執行環境
addopts =
    --strict-config
    --strict-markers
# requirements-test-lock.txt provides pytest-timeout; CI passes --timeout=300
# so this repository remains runnable with the pre-existing runtime venv too.
norecursedirs =
    .git
    .venv
    .codegraph
    outputs
    地圖檔
    torch_hub_cache
    parrot_stimulate
    封存
