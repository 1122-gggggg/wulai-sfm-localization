[pytest]
testpaths =
    tests
    定位演算法/EDM工具包/tests
    定位演算法/validation/tests
    模擬器/sphinx_anafi_path_convergence/tests
pythonpath =
    .
    執行環境
    tools
    控制介面程式
    控制介面程式/operator_interface
    控制介面程式/影片模擬串流
    定位演算法/flight_control
    定位演算法/deploy_code/sfm_glomap_deploy
addopts =
    --strict-config
    --strict-markers
# requirements/test-lock.txt provides pytest-timeout; CI passes --timeout=300
# so this repository remains runnable with the pre-existing runtime venv too.
norecursedirs =
    .git
    .venv
    .codegraph
    outputs
    地圖檔
    torch_hub_cache
    parrot_stimulate
    封存
